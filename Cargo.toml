[package]
name = "pi_key"
version = "0.3.0"
authors = ["suncy <530739162@qq.com>"]
edition = "2021"
description = "Key(idx:u32, version:u32)"
repository = "https://github.com/GaiaWorld/pi_key.git"
license = "MIT OR Apache-2.0"
keywords = ["pi", "key"]
readme = "README.md"


[features]
serde = ["dep:serde"]
fory = ["dep:fory"]


[dependencies]
pi_null = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
fory = { version = "1.7.7", optional = true }
